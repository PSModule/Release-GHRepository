misconfigurations:
  - id: AVD-DS-0002
    paths:
      - .github/actions/linter/Dockerfile
    statement: >-
      GitHub Docker actions require the default root user for the mounted workspace.
      The linter job has read-only permissions and receives no GitHub token.
      https://docs.github.com/en/actions/reference/workflows-and-actions/dockerfile-support#user
  - id: AVD-DS-0026
    paths:
      - .github/actions/linter/Dockerfile
    statement: >-
      This one-shot linter exits after its checks. It is not a long-running service
      and has no health endpoint.
