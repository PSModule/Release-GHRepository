name: Release GHRepository (by PSModule)
description: Creates GitHub releases from owned pull-request labels and effective release settings.
author: PSModule
branding:
  icon: upload-cloud
  color: white

inputs:
  AutoCleanup:
    description: >-
      Delete pull-request prereleases and their tags after the pull request closes.
      Effective standard default: true.
    required: false
  SettingsFilePath:
    description: >-
      Select the repository settings file before startup. Relative paths use an explicit WorkingDirectory,
      otherwise github.workspace. Nonempty named inputs override file values; omitted or empty inputs retain them.
    required: false
    default: .github\auto-release.yml
  DefaultBump:
    description: >-
      The release bump without an owned bump or skip label. Accepts exactly patch, minor, or major.
      Effective standard default: patch. Omit or leave empty to follow repository policy.
    required: false
  CreateMajorTag:
    description: >-
      Control whether to create a major tag when a pull request is merged into the main branch.
      Effective standard default: true.
    required: false
  CreateMinorTag:
    description: >-
      Control whether to create a minor tag when a pull request is merged into the main branch.
      Effective standard default: true.
    required: false
  DatePrereleaseFormat:
    description: >-
      Format the existing prerelease date suffix with a valid .NET format such as yyyyMMddHHmm.
      Effective standard default: empty string (no date suffix).
    required: false
  IncrementalPrerelease:
    description: >-
      Automatically increment the prerelease number; when false, keep one prerelease for the branch.
      Effective standard default: true.
    required: false
  UsePRTitleAsReleaseName:
    description: >-
      Use the pull request title as the GitHub release name.
      Effective standard default: false.
    required: false
  UsePRBodyAsReleaseNotes:
    description: >-
      Use the pull request body as GitHub release notes.
      Effective standard default: true.
    required: false
  UsePRTitleAsNotesHeading:
    description: >-
      Begin release notes with the pull request title and number as an H1 heading.
      Effective standard default: true.
    required: false
  VersionPrefix:
    description: >-
      Prefix the version number.
      Effective standard default: v.
    required: false
  WhatIf:
    description: >-
      Log planned label, release, tag, and comment changes without mutating repository state.
      Effective standard default: false.
    required: false
  Debug:
    description: >-
      Enable GitHub-Script debug output. Effective standard default: false.
    required: false
  Verbose:
    description: >-
      Enable GitHub-Script verbose output. Effective standard default: false.
    required: false
  Version:
    description: >-
      Select the GitHub module dependency by exact version or NuGet version range, such as '[1.2.0, 2.0.0)'.
      Effective standard default: empty string (latest dependency version).
    required: false
  Prerelease:
    description: >-
      Allow prerelease versions of the GitHub module dependency. Effective standard default: false.
      This does not select repository prerelease mode; use the release:prerelease label.
    required: false
  WorkingDirectory:
    description: >-
      Set the execution directory before GitHub-Script starts. Relative values use github.workspace.
      Effective standard default: github.workspace. A file-defined directory does not select another settings file.
    required: false

runs:
  using: composite
  steps:
    - name: Resolve release settings
      id: settings
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        PSMODULE_AUTO_RELEASE_ACTION_PATH: ${{ github.action_path }}
        PSMODULE_AUTO_RELEASE_SETTING_METADATA: |
          AutoCleanup: { Type: Boolean, Default: true, Phase: Release }
          DefaultBump: { Type: Bump, Default: patch, Phase: Release }
          CreateMajorTag: { Type: Boolean, Default: true, Phase: Release }
          CreateMinorTag: { Type: Boolean, Default: true, Phase: Release }
          DatePrereleaseFormat: { Type: DateTimeFormat, Default: '', Phase: Release }
          IncrementalPrerelease: { Type: Boolean, Default: true, Phase: Release }
          UsePRTitleAsReleaseName: { Type: Boolean, Default: false, Phase: Release }
          UsePRBodyAsReleaseNotes: { Type: Boolean, Default: true, Phase: Release }
          UsePRTitleAsNotesHeading: { Type: Boolean, Default: true, Phase: Release }
          VersionPrefix: { Type: Text, Default: v, Phase: Release }
          WhatIf: { Type: Boolean, Default: false, Phase: Release }
          Debug: { Type: Boolean, Default: false, Phase: Startup }
          Verbose: { Type: Boolean, Default: false, Phase: Startup }
          WorkingDirectory: { Type: DirectoryPath, Default: '.', Phase: Startup }
          Version: { Type: VersionConstraint, Default: '', Phase: Startup }
          Prerelease: { Type: Boolean, Default: false, Phase: Startup }
        PSMODULE_AUTO_RELEASE_INPUT_AutoCleanup: ${{ inputs.AutoCleanup }}
        PSMODULE_AUTO_RELEASE_INPUT_SettingsFilePath: ${{ inputs.SettingsFilePath }}
        PSMODULE_AUTO_RELEASE_INPUT_DefaultBump: ${{ inputs.DefaultBump }}
        PSMODULE_AUTO_RELEASE_INPUT_CreateMajorTag: ${{ inputs.CreateMajorTag }}
        PSMODULE_AUTO_RELEASE_INPUT_CreateMinorTag: ${{ inputs.CreateMinorTag }}
        PSMODULE_AUTO_RELEASE_INPUT_DatePrereleaseFormat: ${{ inputs.DatePrereleaseFormat }}
        PSMODULE_AUTO_RELEASE_INPUT_IncrementalPrerelease: ${{ inputs.IncrementalPrerelease }}
        PSMODULE_AUTO_RELEASE_INPUT_UsePRBodyAsReleaseNotes: ${{ inputs.UsePRBodyAsReleaseNotes }}
        PSMODULE_AUTO_RELEASE_INPUT_UsePRTitleAsReleaseName: ${{ inputs.UsePRTitleAsReleaseName }}
        PSMODULE_AUTO_RELEASE_INPUT_UsePRTitleAsNotesHeading: ${{ inputs.UsePRTitleAsNotesHeading }}
        PSMODULE_AUTO_RELEASE_INPUT_VersionPrefix: ${{ inputs.VersionPrefix }}
        PSMODULE_AUTO_RELEASE_INPUT_WhatIf: ${{ inputs.WhatIf }}
        PSMODULE_AUTO_RELEASE_INPUT_Debug: ${{ inputs.Debug }}
        PSMODULE_AUTO_RELEASE_INPUT_Verbose: ${{ inputs.Verbose }}
        PSMODULE_AUTO_RELEASE_INPUT_WorkingDirectory: ${{ inputs.WorkingDirectory }}
        PSMODULE_AUTO_RELEASE_INPUT_Version: ${{ inputs.Version }}
        PSMODULE_AUTO_RELEASE_INPUT_Prerelease: ${{ inputs.Prerelease }}
      run: |
        $null = & (Join-Path -Path $env:PSMODULE_AUTO_RELEASE_ACTION_PATH -ChildPath 'src\Initialize-ReleaseConfiguration.ps1')

    - name: Release-GHRepository
      uses: PSModule/GitHub-Script@8083ec1f733f00357ee4d0db0c6056686e483bc0 # v1.9.0
      env:
        PSMODULE_AUTO_RELEASE_ACTION_PATH: ${{ github.action_path }}
        PSMODULE_AUTO_RELEASE_RESOLVED_SETTINGS: ${{ steps.settings.outputs.ReleaseSettings }}
      with:
        Debug: ${{ steps.settings.outputs.Debug }}
        Prerelease: ${{ steps.settings.outputs.Prerelease }}
        Verbose: ${{ steps.settings.outputs.Verbose }}
        Version: ${{ steps.settings.outputs.Version }}
        Name: Release-GHRepository
        WorkingDirectory: ${{ steps.settings.outputs.WorkingDirectory }}
        Script: |
          $releaseSettings = ConvertFrom-Json -InputObject $env:PSMODULE_AUTO_RELEASE_RESOLVED_SETTINGS
          & (Join-Path -Path $env:PSMODULE_AUTO_RELEASE_ACTION_PATH -ChildPath 'src\main.ps1') -Settings $releaseSettings
